<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>励志资源库 - 多媒体页面</title>
    <link rel="stylesheet" href="css/style3.css">
</head>
<body>
    <!-- 导航栏 -->
    <div class="nav">
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="form.html">正能量打卡</a></li>
            <li><a href="media.html">励志资源库</a></li>
            <li><a href="#contact">联系我们</a></li>
        </ul>
    </div>
    <!-- 多媒体容器 -->
    <div class="media-container">
        <h2 class="media-title">励志资源库</h2>
        <!-- 图片轮播（3张励志图片） -->
        <div class="img-slider">
            <img src="images/img1.jpg" alt="励志图片1" class="active">
            <img src="images/img2.jpg" alt="励志图片2">
            <img src="images/img3.jpg" alt="励志图片3">
        </div>
        <!-- 视频区域 -->
        <div class="video-box">
            <video controls>
                <source src="videos/encourage.mp4" type="video/mp4">
                您的浏览器不支持视频播放
            </video>
        </div>
        <!-- 音频+文字动画 -->
        <div class="audio-text">
            <audio controls>
                <source src="audios/warm.mp3" type="audio/mpeg">
                您的浏览器不支持音频播放
            </audio>
            <div class="animate-text">
                每一次努力都不会白费<br>
                每一次坚持都终将闪耀<br>
                保持热爱，奔赴山海
            </div>
        </div>
    </div>
    <!-- 页脚 -->
    <div class="footer" id="contact">
        <p>版权所有 © 正能量生活分享平台</p>
        <p>专业：物联网 | 班级：二班 | 学号：250402081 | 姓名：袁成勋 </p>
    </div>

    <script>
        // 图片轮播逻辑
        let imgs = document.querySelectorAll('.img-slider img');
        let index = 0;
        setInterval(() => {
            imgs[index].classList.remove('active');
            index = (index + 1) % imgs.length;
            imgs[index].classList.add('active');
        }, 3000);
    </script>
</body>
</html>
